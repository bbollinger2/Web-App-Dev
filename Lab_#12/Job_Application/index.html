<!DOCTYPE html>

<html lang="en">

    <head>

        <meta charset="UTF-8">

        <title>Job Application Form</title>

        <link rel="stylesheet" href="style.css">

    </head>

    <body>

        <h1>Job Application Form</h1>

        <form id="user_info">

            <label for="name">Name:</label>
            <input id="name" type="" placeholder="Enter your name" required> <br>
            
            <label for="email">Email:</label>
            <input id="email" type="" placeholder="Enter your email" required> <br>

            <label for="description">Description:</label>
            <textarea id="description" rows="4" placeholder="Describe yourself..." required></textarea> <br>

            <label for="position">Position:</label>
            <input id="position" type="text" placeholder="Enter the position you are applying for" required> <br>

            <label for="experience">Experience:</label>
            <textarea id="experience" rows="4" placeholder="Enter your experience" required></textarea>

            <button type="submit">Submit</button>

        </form>

        <section id="result"></section>

        <script src="script.js"></script>

    </body>

</html>
