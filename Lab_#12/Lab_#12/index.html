<!DOCTYPE html>

<html lang="en">

    <head>

        <meta charset="UTF-8">

        <title>Lab #12 </title>

    </head>

    <body>

        <h1>Lab #12</h1>

        <form id="user_info">

            <label for="name">Name:</label>
            <input id="name" type="" placeholder="Enter your name" required>
            
            <label for="email">Email:</label>
            <input id="email" type="" placeholder="Enter your email" required>

            <label for="message">Message:</label>
            <textarea id="message" rows="4" placeholder="Write something..." required></textarea>

            <label for="color">Favorite Color:</label>
            <input id="color" type="text" placeholder="Enter your favorite color" required>

            <button type="submit">Submit</button>

        </form>

        <section id="result"></section>

        <script src="script.js"></script>

    </body>

</html>
