<!DOCTYPE html>

<html>

<head>

    <title>JavaScript Lab</title>

    <script>

        // This is a simple JavaScript program that declares three variables: name, age, and male. 
       
        let name = "Braedon";

        let age = 20;

        let male = true;



        // The program then uses the console.log() function to print the values of these variables to the console.
       
        console.log("Name: " + name);
        
        console.log("Age: " + age);

        console.log("Male: " + male);



        // The program also declares a variable called result and assigns it the value of 12 multiplied by 12.
       
        let result = 12 * 12; 

        console.log("Result: " + result);



        // Finally, the program creates a greeting message using string concatenation and prints it to the console.

        let greeting = "Hello, " + name + "! You are " + age + " years old.";

        console.log(greeting);

    </script>

</head>

</html>
